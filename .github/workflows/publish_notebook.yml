name: Publish Notebook

on:
  push:
    branches:
      - main
    paths:
      - 'notebooks/analysis/lego_analysis.ipynb'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install jupyter nbconvert

      - name: Convert notebook to HTML
        run: |
          mkdir -p rendered
          jupyter nbconvert --to html \
            --no-input \
            --output-dir rendered \
            --output index \
            notebooks/analysis/lego_analysis.ipynb

      - name: Commit rendered HTML to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rendered/index.html
          git diff --staged --quiet || git commit -m "Update rendered notebook HTML"
          git push
